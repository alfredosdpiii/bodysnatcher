[package]
name = "bodysnatcher"
version = "0.2.0"
edition = "2024"
description = "Resume any harness' session in any other harness: Factory Droid, Pi, OMP, Claude Code, and Codex"
license = "MIT"
repository = "https://github.com/alfredosdpiii/bodysnatcher"
homepage = "https://github.com/alfredosdpiii/bodysnatcher"
readme = "README.md"
keywords = ["ai", "cli", "tui", "session", "harness"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
