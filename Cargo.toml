[package]
name = "bodysnatcher"
version = "0.1.0"
edition = "2024"
description = "Resume any harness' session in any other harness: Factory Droid, Pi, and OMP"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
